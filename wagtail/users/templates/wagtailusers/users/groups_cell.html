{% load i18n wagtailadmin_tags %}
<td {% if column.classname %}class="{{ column.classname }}"{% endif %}>
    {% for item in value %}
        {% if item.is_admin %}
            {% status item.name classname="w-status--primary" %}
        {% else %}
            {% status item.name classname="w-status--label" %}
        {% endif %}
    {% empty %}
        —
    {% endfor %}
</td>
